name: Eval CI

on:
  pull_request:
    paths:
      - "src/**"
      - "eval/**"
      - "pyproject.toml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (dev extras)
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -v

  eval:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (eval extras)
        run: pip install -e ".[dev,eval]"

      - name: Ingest golden docs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENABLE_QUERY_TRANSFORM: "false"
        run: ask-my-docs ingest data/docs

      - name: Run RAGAS eval with threshold gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENABLE_QUERY_TRANSFORM: "false"
        run: |
          python -m ask_my_docs.eval.run_eval \
            --golden eval/golden_set.json \
            --output eval/results.json \
            --assert-thresholds

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results.json
